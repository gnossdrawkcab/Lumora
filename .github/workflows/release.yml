name: Build APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Install matching build-tools
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"

      # Keep signing secrets out of a third-party action. apksigner is part of the Android SDK
      # already installed on the isolated runner and does not upload the key anywhere.
      - name: Sign APK
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY }}
          SIGNING_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/lumora-signing.jks"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/lumora-signing.jks" \
            --ks-key-alias "$SIGNING_ALIAS" \
            --ks-pass "env:KEYSTORE_PASSWORD" \
            --key-pass "env:KEY_PASSWORD" \
            --out app/build/outputs/apk/release/Lumora.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/Lumora.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Lumora-APK
          path: app/build/outputs/apk/release/Lumora.apk
          compression-level: 0

      # Release notes come from the tag's own section of CHANGELOG.md, so a release says
      # what actually changed rather than just "download the APK". The awk block takes
      # everything between this version's "## x.y" heading and the next one; if the tag has
      # no section (or the file is missing), it falls back to a generic body rather than
      # publishing an empty release.
      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "## Lumora ${GITHUB_REF_NAME}"
            echo
            awk -v ver="$VERSION" '
              $0 == "## " ver { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md
            echo
            echo "### Installation"
            echo "Download the APK below and install on your Android TV, Fire TV Stick, or phone."
          } > release-notes.md
          if [ "$(grep -c '[^[:space:]]' release-notes.md)" -le 4 ]; then
            echo "No CHANGELOG entry for $VERSION - using generic notes"
            printf '## Lumora %s\n\n### Installation\nDownload the APK below and install on your Android TV, Fire TV Stick, or phone.\n' "$GITHUB_REF_NAME" > release-notes.md
          fi
          cat release-notes.md

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Lumora ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            app/build/outputs/apk/release/Lumora.apk
